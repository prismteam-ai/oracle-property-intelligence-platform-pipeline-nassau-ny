destination:
  writes_in_scope: true
  proven: true
  mode: "internal reconciliation store = local DuckDB file (operator decision 2026-10-25; no hosted database)"
  project: oracle-property-intelligence-platform-pipeline-nassau-ny
  environment: local-non-production
  database_file: data/nassau.duckdb (repo-relative, gitignored)
  writer: pipeline.run single writer (exclusive flock on data/.pipeline.lock)
  independent_identity_sources:
    - "pipeline/config.py DB_PATH resolves to <repo>/data/nassau.duckdb (code-configured path)"
    - "duckdb_databases() on the opened connection reports the same file path, and pipeline_runs in that file holds the run ids written by this pipeline"
  credentials: none (local file)

